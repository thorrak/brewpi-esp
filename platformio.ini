[env:esp32_wifi_espi]
board = esp32dev
platform = ${common.platform}
framework = ${common.framework}
; board_build.arduino.upstream_packages = no
; For esp32_wifi_tft we want to enable LCD support, TFT support, and WiFi support
build_flags =
    ${common.build_flags}
    -DBREWPI_LCD
    -DBREWPI_TFT
    -DBREWPI_TFT_ESPI
    -DHAS_AXP192
    -DCONNECT_VIA_WIFI
    -DHAS_BLUETOOTH
    -DEXTERN_SENSOR_ACTUATOR_SUPPORT
    ; -DENABLE_PROMETHEUS_SERVER
    -DENABLE_HTTP_INTERFACE
    -DESP32_STOCK
    -DoneWirePin=33       ; GPIO 13 conflicts with ST7789 SPI SCLK on M5StickC Plus

lib_deps =
    ${common.lib_deps}
    ${common.lib_deps_graphics}
upload_speed = 1500000
monitor_speed = ${common.monitor_speed}
board_build.partitions = 4mb_no_ota.csv
board_build.filesystem = littlefs
build_type = ${common.build_type}
monitor_filters =
    esp32_exception_decoder
