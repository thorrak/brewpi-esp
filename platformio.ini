; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/en/stable/projectconf.html

[platformio]
; Added this here to "hard code" the environment for macro debugging/visuals
;default_envs = esp32_wifi_tft


[env]
lib_compat_mode = off
; Builds the Vue UI from ui/ and copies artifacts into data/ when the
; `buildfs` (or `uploadfs`) target runs. Firmware-only builds are unaffected.
; Requires Node.js/npm on PATH — see ui/README.md.
extra_scripts = pre:scripts/build_ui.py


[common]
framework = espidf
; The default platform & platform package only applies to ESP32 derivatives
platform = espressif32@6.13.0
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    https://github.com/thorrak/thorlog.git
    ;https://github.com/thorrak/esp32_ds18b20.git ; todo - replace this with the idf components directly
lib_deps_graphics =
    lovyan03/LovyanGFX@^1.2.19
; Let's also include some other common build flags for ease-of-use
build_flags =
    !python3 scripts/gen_version.py
    -DCONFIG_USE_NATIVE_CPP_NEW
    -D THORLOG_LOG_LEVEL=0              ; Set Serial log level (6 = high)
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0    ; Set NimBLE log level (4 = high)
    -D DISABLE_LOGGING                  ; This will remove log lib from sketch
    -D FIRMWARE_REVISION=\"v17-adaptive-dose1\"

upload_speed = 460800
monitor_speed = 115200
; These are true for most devices on MacOS - Will likely need to be changed if compiling on other platforms
build_type = release
monitor_dtr = 1
monitor_rts = 1


[env:esp32_wifi_tft]
board = lolin_d32
platform = ${common.platform}
framework = ${common.framework}
; board_build.arduino.upstream_packages = no
; For esp32_wifi_tft we want to enable LCD support, TFT support, and WiFi support
build_flags =
    ${common.build_flags}
    -DBREWPI_LCD
    ; BREWPI_TFT is the flag we're using for TFTs in general
    ; BREWPI_TFT_ILI9341 is the flag we're using for the "big" (LoLin) TFTs
    -DBREWPI_TFT
    -DBREWPI_TFT_ILI9341
    -DD32_PRO_TFT
    -DCONNECT_VIA_WIFI
    -DHAS_BLUETOOTH
    -DEXTERN_SENSOR_ACTUATOR_SUPPORT
    ; -DENABLE_PROMETHEUS_SERVER
    -DENABLE_HTTP_INTERFACE
    -DESP32_STOCK
lib_deps =
    ${common.lib_deps}
    ${common.lib_deps_graphics}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_build.partitions = 4mb_no_ota.csv
board_build.filesystem = littlefs
build_type = ${common.build_type}
monitor_filters =
    esp32_exception_decoder


[env:esp32_wifi_iic]
board = lolin_d32
platform = ${common.platform}
framework = ${common.framework}
; For esp32_wifi_iic we want to enable LCD support, IIC support, and WiFi support
build_flags =
    ${common.build_flags}
    -DBREWPI_LCD
    -DBREWPI_IIC
    -DCONNECT_VIA_WIFI
    -DHAS_BLUETOOTH
    -DEXTERN_SENSOR_ACTUATOR_SUPPORT
    ; -DENABLE_PROMETHEUS_SERVER
    -DENABLE_HTTP_INTERFACE
    -DESP32_STOCK
lib_deps =
    ${common.lib_deps}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_build.partitions = 4mb_no_ota.csv
board_build.filesystem = littlefs
build_type = ${common.build_type}
monitor_filters =
    esp32_exception_decoder

; Dedicated cooling-only test image for the known Chillsim D32 Pro hardware.
; General BrewPi environments retain normal heating and provisioning behavior.
[env:esp32_chillsim_test]
extends = env:esp32_wifi_iic
board = lolin_d32_pro
build_flags =
    ${common.build_flags}
    -DBREWPI_LCD
    -DBREWPI_IIC
    -DCONNECT_VIA_WIFI
    -DENABLE_HTTP_INTERFACE
    -DESP32_STOCK
    -DBREWPI_CHILLSIM_TEST


